<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 96">
  <!-- Raw material deposit outcrop for the planet surface view.
       Bottom center of the drawing is the cell's front corner; the base
       ellipse spans the full width (2:1 isometric footprint). -->
  <defs>
    <linearGradient id="rock" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6d6058"/>
      <stop offset="0.55" stop-color="#433a35"/>
      <stop offset="1" stop-color="#241f1c"/>
    </linearGradient>
    <linearGradient id="crystal" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#b34a08"/>
      <stop offset="0.5" stop-color="#ff9a2e"/>
      <stop offset="1" stop-color="#ffe7a8"/>
    </linearGradient>
    <linearGradient id="crystalDark" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0" stop-color="#7a2f05"/>
      <stop offset="1" stop-color="#e2771c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.6" r="0.5">
      <stop offset="0" stop-color="#ffc861" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ff8a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="50" cy="72" rx="50" ry="24" fill="url(#glow)"/>
  <path d="M8 74 C 10 62, 24 56, 36 58 C 44 50, 60 50, 68 57 C 82 56, 94 63, 92 74 C 86 86, 64 95, 50 95 C 34 95, 12 86, 8 74 Z" fill="url(#rock)"/>
  <path d="M36 58 C 44 50, 60 50, 68 57 C 60 62, 44 63, 36 58 Z" fill="#7d7068" opacity="0.6"/>
  <g stroke="#fff3cf" stroke-opacity="0.55" stroke-width="0.8" stroke-linejoin="round">
    <path d="M40 70 L 34 40 L 41 30 L 47 41 L 46 70 Z" fill="url(#crystal)"/>
    <path d="M41 30 L 47 41 L 46 70 L 43 70 Z" fill="url(#crystalDark)" stroke="none"/>
    <path d="M50 74 L 52 26 L 60 14 L 66 28 L 59 74 Z" fill="url(#crystal)"/>
    <path d="M60 14 L 66 28 L 59 74 L 56 74 Z" fill="url(#crystalDark)" stroke="none"/>
    <path d="M62 72 L 70 48 L 77 44 L 78 52 L 68 74 Z" fill="url(#crystal)"/>
    <path d="M28 76 L 24 58 L 29 52 L 33 60 L 32 77 Z" fill="url(#crystal)"/>
  </g>
  <path d="M53 30 L 55 60" stroke="#fffbe8" stroke-width="1.4" stroke-linecap="round" opacity="0.8"/>
  <path d="M37 44 L 40 62" stroke="#fffbe8" stroke-width="1" stroke-linecap="round" opacity="0.7"/>
</svg>
