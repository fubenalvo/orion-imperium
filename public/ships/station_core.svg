<svg xmlns="http://www.w3.org/2000/svg" id="ship" viewBox="0 0 160 150" preserveAspectRatio="xMidYMid meet">
  <!-- Station Core (space base hull): habitat ring around a command hub with docking arms. Top-down, front pointing right. Scale: 100 units = 1 battlefield unit.
       Faction accents use currentColor; the engine glow group reads the ship-engine and
       engine-glow CSS custom properties set by the battle grid (here: station lights). See docs/battle-screen.md. -->
  <rect x="74" y="4" width="12" height="142" rx="3" fill="#3d6662" stroke="#08131c" stroke-width="1.6"/>
  <rect x="9" y="69" width="142" height="12" rx="3" fill="#3d6662" stroke="#08131c" stroke-width="1.6"/>
  <circle cx="80" cy="75" r="58" fill="none" stroke="#08131c" stroke-width="18"/>
  <circle cx="80" cy="75" r="58" fill="none" stroke="#9ac9c2" stroke-width="14"/>
  <circle cx="80" cy="75" r="58" fill="none" stroke="currentColor" stroke-width="2.4" stroke-dasharray="10 12"/>
  <rect x="140" y="64" width="16" height="22" rx="3" fill="#73a49e" stroke="#08131c" stroke-width="1.6"/>
  <rect x="4" y="64" width="16" height="22" rx="3" fill="#73a49e" stroke="#08131c" stroke-width="1.6"/>
  <rect x="69" y="0.8" width="22" height="14" rx="3" fill="#73a49e" stroke="#08131c" stroke-width="1.6"/>
  <rect x="69" y="135.2" width="22" height="14" rx="3" fill="#73a49e" stroke="#08131c" stroke-width="1.6"/>
  <circle cx="80" cy="75" r="28" fill="#73a49e" stroke="#08131c" stroke-width="2.4"/>
  <circle cx="80" cy="75" r="18" fill="#c9ebe5" stroke="#08131c" stroke-width="1.6"/>
  <circle cx="80" cy="75" r="8" fill="currentColor" stroke="#08131c" stroke-width="1.2"/>
  <g style="fill: var(--ship-engine, #bff4ff); opacity: var(--engine-glow, 1)">
    <circle cx="148" cy="75" r="2.6"/>
    <circle cx="12" cy="75" r="2.6"/>
    <circle cx="80" cy="7" r="2.6"/>
    <circle cx="80" cy="143" r="2.6"/>
  </g>
</svg>
