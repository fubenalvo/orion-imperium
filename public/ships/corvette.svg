<svg xmlns="http://www.w3.org/2000/svg" id="ship" viewBox="0 0 118 62" preserveAspectRatio="xMidYMid meet">
  <!-- Corvette (Light Combat): wedge gunboat with twin forward cannons. Top-down, bow pointing right. Scale: 100 units = 1 battlefield unit.
       Faction accents use currentColor; the engine glow group reads the ship-engine and
       engine-glow CSS custom properties set by the battle grid. See docs/battle-screen.md. -->
  <g style="fill: var(--ship-engine, #bff4ff); opacity: var(--engine-glow, 1)">
    <ellipse cx="5.5" cy="24" rx="6.5" ry="3.5" opacity="0.45"/>
    <ellipse cx="8.3" cy="24" rx="3.8" ry="2" fill="#ffffff"/>
    <ellipse cx="5.5" cy="38" rx="6.5" ry="3.5" opacity="0.45"/>
    <ellipse cx="8.3" cy="38" rx="3.8" ry="2" fill="#ffffff"/>
  </g>
  <rect x="10" y="20.5" width="4.2" height="7" rx="1" fill="#3d6662" stroke="#08131c" stroke-width="1.2"/>
  <rect x="10" y="34.5" width="4.2" height="7" rx="1" fill="#3d6662" stroke="#08131c" stroke-width="1.2"/>
  <polygon points="22,19 14,5 22,2.5 36,5 54,19" fill="#73a49e" stroke="#08131c" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="22,43 14,57 22,59.5 36,57 54,43" fill="#73a49e" stroke="#08131c" stroke-width="2" stroke-linejoin="round"/>
  <polygon points="30,4.5 36,5 42,7.5 30,7.5" fill="currentColor"/>
  <polygon points="30,57.5 36,57 42,54.5 30,54.5" fill="currentColor"/>
  <rect x="78" y="22.5" width="32" height="3" fill="#c9ebe5" stroke="#08131c" stroke-width="1"/>
  <rect x="78" y="36.5" width="32" height="3" fill="#c9ebe5" stroke="#08131c" stroke-width="1"/>
  <polygon points="12,21 22,18 42,17 72,19.5 100,25 114,31 100,37 72,42.5 42,45 22,44 12,41" fill="#9ac9c2" stroke="#08131c" stroke-width="2.4" stroke-linejoin="round"/>
  <polygon points="30,21 70,22 86,26 30,26" fill="#73a49e"/>
  <polygon points="30,41 70,40 86,36 30,36" fill="#73a49e"/>
  <line x1="30" y1="31" x2="86" y2="31" stroke="#08131c" stroke-width="1.2" stroke-linecap="round"/>
  <rect x="80" y="29" width="10" height="4" rx="2" fill="currentColor"/>
</svg>
