<svg xmlns="http://www.w3.org/2000/svg" id="ship" viewBox="0 0 130 80" preserveAspectRatio="xMidYMid meet">
  <!-- Outpost Ship: folded station frame (ring segments and antenna mast) on a heavy tug spine. Top-down, bow pointing right. Scale: 100 units = 1 battlefield unit.
       Faction accents use currentColor; the engine glow group reads the ship-engine and
       engine-glow CSS custom properties set by the battle grid. See docs/battle-screen.md. -->
  <g style="fill: var(--ship-engine, #bff4ff); opacity: var(--engine-glow, 1)">
    <ellipse cx="6.5" cy="30" rx="5.5" ry="3.8" opacity="0.45"/>
    <ellipse cx="9" cy="30" rx="3.3" ry="2.1" fill="#ffffff"/>
    <ellipse cx="6.5" cy="50" rx="5.5" ry="3.8" opacity="0.45"/>
    <ellipse cx="9" cy="50" rx="3.3" ry="2.1" fill="#ffffff"/>
  </g>
  <rect x="10" y="25.5" width="5" height="9" rx="1" fill="#3d6662" stroke="#08131c" stroke-width="1.2"/>
  <rect x="10" y="45.5" width="5" height="9" rx="1" fill="#3d6662" stroke="#08131c" stroke-width="1.2"/>
  <rect x="15" y="22" width="22" height="36" rx="3" fill="#73a49e" stroke="#08131c" stroke-width="2"/>
  <rect x="37" y="35" width="70" height="10" fill="#3d6662" stroke="#08131c" stroke-width="1.6"/>
  <path d="M44 35 V8 a6 6 0 0 1 6 -6 h26 a6 6 0 0 1 6 6 V35" fill="none" stroke="#9ac9c2" stroke-width="7"/>
  <path d="M44 35 V8 a6 6 0 0 1 6 -6 h26 a6 6 0 0 1 6 6 V35" fill="none" stroke="#08131c" stroke-width="1.4" stroke-dasharray="2 5"/>
  <path d="M44 45 V72 a6 6 0 0 0 6 6 h26 a6 6 0 0 0 6 -6 V45" fill="none" stroke="#9ac9c2" stroke-width="7"/>
  <path d="M44 45 V72 a6 6 0 0 0 6 6 h26 a6 6 0 0 0 6 -6 V45" fill="none" stroke="#08131c" stroke-width="1.4" stroke-dasharray="2 5"/>
  <rect x="53" y="13" width="20" height="9" rx="2" fill="currentColor" stroke="#08131c" stroke-width="1.2"/>
  <rect x="53" y="58" width="20" height="9" rx="2" fill="currentColor" stroke="#08131c" stroke-width="1.2"/>
  <circle cx="63" cy="40" r="11" fill="#9ac9c2" stroke="#08131c" stroke-width="2"/>
  <circle cx="63" cy="40" r="5" fill="currentColor" stroke="#08131c" stroke-width="1.2"/>
  <rect x="104" y="33" width="14" height="14" rx="3" fill="#73a49e" stroke="#08131c" stroke-width="1.6"/>
  <line x1="118" y1="40" x2="128" y2="40" stroke="#c9ebe5" stroke-width="2"/>
  <circle cx="127" cy="40" r="2" fill="currentColor"/>
</svg>
