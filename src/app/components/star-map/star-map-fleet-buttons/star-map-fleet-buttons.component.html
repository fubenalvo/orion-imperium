@if (playerPlanets.length > 0 || playerFleets.length > 0) {
  <!-- One shared box for both lists, docked into the top-left corner. -->
  <div class="map-roster panel-style">
    @if (playerPlanets.length > 0) {
      <nav class="fleet-buttons" aria-label="Your planets">
        <div class="fleet-buttons__title">Planets</div>
        <div class="fleet-buttons__list">
          @for (entry of playerPlanets; track entry.planet) {
            <button
              class="fleet-btn"
              [appTutorialAnchor]="$first ? 'roster.planet' : null"
              [style.--fleet-color]="getFactionColor('player')"
              type="button"
              [title]="entry.planet.name + ' — ' + entry.system.name"
              (click)="openPlanet.emit(entry); $event.stopPropagation()"
            >
              <span>{{ entry.planet.name }}</span>
            </button>
          }
        </div>
      </nav>
    }

    @if (playerFleets.length > 0) {
      <nav class="fleet-buttons" aria-label="Your fleets">
        <div class="fleet-buttons__title">Fleets</div>
        <div class="fleet-buttons__list">
          @for (fleet of playerFleets; track fleet.id) {
            <button
              class="fleet-btn"
              [class.selected]="selectedFleetId === fleet.id"
              [appTutorialAnchor]="'roster.fleet.' + fleet.id"
              [style.--fleet-color]="getFactionColor(fleet.factionId)"
              type="button"
              (click)="selectFleet.emit(fleet); $event.stopPropagation()"
            >
              <span>{{ fleet.name }}</span>
            </button>
          }
        </div>
      </nav>
    }
  </div>
}
