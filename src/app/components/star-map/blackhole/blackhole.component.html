<!--
  Layer order (back to front), see blackhole.component.scss:
  bloom + light streak, far half of the accretion disk, Einstein ring and
  its thick upper arc (the lensed far disk), shadow, photon ring, near half
  of the disk crossing in front of the shadow.
-->
<div class="bloom"></div>
<div class="streak"></div>

<div class="disk disk--back">
  <div class="disk__glow"></div>
  <div class="disk__swirl"></div>
</div>

<div class="einstein-ring"></div>
<div class="lensed-arc"></div>

<div class="event-horizon"></div>

<div class="photon-ring"></div>

<div class="disk disk--front">
  <div class="disk__glow"></div>
  <div class="disk__swirl"></div>
</div>
