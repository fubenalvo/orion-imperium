<div class="ship-stock">
  <button
    type="button"
    class="ship-stock__toggle"
    (click)="toggleDetails()"
    [class.ship-stock__toggle--empty]="totalShips === 0"
    title="Global empire ship stock"
  >
    <span class="ship-stock__icon"><img src="/icon-spaceship.png" alt="" width="16" height="16" /></span>
    <span class="ship-stock__value">{{ totalShips }}</span>
    <span class="ship-stock__label">STOCK</span>
  </button>

  @if (showDetails) {
    <div class="hud-overlay" (click)="closeDetails($event)">
      <div class="hud-overlay__panel" (click)="$event.stopPropagation()">
        <div class="hud-overlay__title"><img src="/icon-spaceship.png" alt="" width="16" height="16" class="info-icon" /> Global Empire Ship Stock</div>

        @if (entries.length === 0) {
          <div class="ship-stock__empty">No ships in stock. Build a Spaceship Factory to start production.</div>
        } @else {
          @for (entry of entries; track entry.typeId) {
            <div class="hud-overlay__row">
              <span class="ship-stock__type">{{ entry.typeName }}</span>
              <span class="ship-stock__count">x{{ entry.count }}</span>
            </div>
          }
        }
      </div>
    </div>
  }
</div>
