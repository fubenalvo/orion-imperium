<app-game-header
  [title]="title"
  [backLabel]="backLabel"
  [speedOptions]="speedOptions"
  [activeSpeed]="gameSpeed"
  [isPaused]="isPaused"
  [showMenuButton]="true"
  (back)="back.emit()"
  (togglePause)="togglePause.emit()"
  (setSpeed)="onSetSpeed($event)"
  (openMenu)="openMenu.emit()"
>
  <app-faction-currencies
    [currencies]="currencies"
    [economyBreakdown]="economyBreakdown"
    (openResearchTree)="openResearchTree.emit()"
  ></app-faction-currencies>

  <app-star-map-ship-stock
    [entries]="shipStockEntries"
    [totalShips]="shipStockTotal"
  ></app-star-map-ship-stock>
</app-game-header>
