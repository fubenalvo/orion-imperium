<div class="star-map-options">
  <div class="star-map-options__backdrop" (click)="onBackdropClick($event)">
    <div class="star-map-options__content">
      <div class="star-map-options__title">OPTIONS</div>

      <div class="star-map-options__row">
        <label class="star-map-options__checkbox-label">
          <input
            type="checkbox"
            class="star-map-options__checkbox"
            [checked]="fogOfWarEnabled"
            (change)="onToggleFogOfWar()"
          />
          <span>FOG OF WAR</span>
        </label>
      </div>

      <div class="star-map-options__row">
        <label class="star-map-options__checkbox-label">
          <input
            type="checkbox"
            class="star-map-options__checkbox"
            [checked]="uiSound.enabled()"
            (change)="uiSound.toggle()"
          />
          <span>UI SOUNDS</span>
        </label>
      </div>

      <div class="star-map-options__row">
        <label class="star-map-options__checkbox-label">
          <input
            type="checkbox"
            class="star-map-options__checkbox"
            [checked]="music.enabled()"
            (change)="music.toggle()"
          />
          <span>MUSIC</span>
        </label>
      </div>

      <div class="star-map-options__row">
        <label class="star-map-options__slider-label">
          <span>MUSIC VOLUME</span>
          <input
            type="range"
            class="star-map-options__slider"
            min="0"
            max="100"
            step="5"
            [value]="music.volume() * 100"
            [disabled]="!music.enabled()"
            (input)="onMusicVolume($event)"
          />
          <span class="star-map-options__slider-value">{{ (music.volume() * 100).toFixed(0) }}%</span>
        </label>
      </div>

      <div class="star-map-options__row">
        <label class="star-map-options__checkbox-label">
          <input
            type="checkbox"
            class="star-map-options__checkbox"
            [checked]="aiSettings.adaptive()"
            (change)="aiSettings.toggleAdaptive()"
          />
          <span>ADAPTIVE AI</span>
        </label>
      </div>

      @if (tutorial.inGame()) {
        <div class="star-map-options__row">
          <label class="star-map-options__checkbox-label">
            <input
              type="checkbox"
              class="star-map-options__checkbox"
              [checked]="tutorial.enabled()"
              (change)="tutorial.setEnabled(!tutorial.enabled())"
            />
            <span>TUTORIAL</span>
          </label>
          <button class="star-map-options__btn-reset" type="button" (click)="tutorial.reset()">RESET TUTORIAL</button>
        </div>
      }

      <button class="star-map-options__btn-back" type="button" (click)="onClose()">BACK</button>
    </div>
  </div>
</div>
