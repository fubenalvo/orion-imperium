<div class="battle-grid" (click)="onGridClickHandler($event)">
  <!-- PLANET VISUAL (planet battles only; separate from BattleStack) -->
  @if (planet) {
    <app-battle-planet
      [planet]="planet"
      [shieldFraction]="planetShieldFraction"
    ></app-battle-planet>
  }

  <!-- MOVEMENT HIGHLIGHTS -->
  @for (cell of moveCells; track cell.col + '-' + cell.row) {
    <div
      class="move-cell"
      [style.left]="cellVw(cell).x + 'vw'"
      [style.top]="cellVw(cell).y + 'vw'"
    ></div>
  }

  <!-- STACKS -->
  @for (stack of stacks; track stack.stackId) {
    <div
      class="stack-cell"
      [ngClass]="'stack-cell--size-' + stackSize(stack)"
      [style.left]="stackVw(stack).x + 'vw'"
      [style.top]="stackVw(stack).y + 'vw'"
      [style.transition]="stackTransition(stack)"
      [class.stack-cell--selected]="stack.stackId === selectedStackId"
    >
      <button
        class="stack"
        [ngClass]="stackClasses(stack)"
        [class.stack--defender]="stack.side === 'defender'"
        [class.carrier-boost-target]="isCarrierBoostTarget(stack.stackId)"
        type="button"
        (click)="onStackClickHandler($event, stack.stackId)"
      >
        <span class="stack__count">{{ stack.ships.length }}</span>
        <span class="stack__hp">
          <span class="stack__hp-bar" [style.width.%]="hullFraction(stack) * 100"></span>
        </span>
        <span class="stack__shield" [class.stack__shield--hit]="isShieldHit(stack.stackId)">
          <span class="stack__shield-bar" [style.width.%]="shieldFraction(stack) * 100"></span>
        </span>
        <!-- Attack-available marker: crosshair.png in the top-right corner.
             Only shown for the active side; hidden once the stack has fired. -->
        <span
          class="stack__attack-dot"
          [class.stack__attack-dot--hidden]="!hasAttackDot(stack)"
        ></span>
      </button>
    </div>
  }

  <!-- ATTACK EFFECTS -->
  @if (getProjectileLine(); as line) {
    <div
      class="projectile"
      [style.left]="line.x + 'vw'"
      [style.top]="line.y + 'vw'"
      [style.width]="line.length + 'vw'"
      [style.--projectile-angle]="line.angleDeg + 'deg'"
    ></div>
  }
  @if (effect?.phase === 'impact' || effect?.phase === 'explosion') {
    <div
      class="impact"
      [class.impact--explosion]="effect?.phase === 'explosion'"
      [style.left]="effect.to.x + 'vw'"
      [style.top]="effect.to.y + 'vw'"
    ></div>
  }
</div>
